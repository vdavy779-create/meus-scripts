<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>.. scripts. | Gerador de Key</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0b0b12; --card: #15151f; --border: #26262f;
    --accent: #a855f7; --accent-2: #7c3aed; --text: #e8e8ef; --muted: #8b8b9a;
  }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh;
    display: flex; flex-direction: column;
    background-image: radial-gradient(circle at 20% 0%, rgba(168,85,247,.15), transparent 40%), radial-gradient(circle at 80% 100%, rgba(124,58,237,.12), transparent 40%);
  }
  header { text-align: center; padding: 48px 20px 24px; }
  header h1 { font-size: 2.4rem; background: linear-gradient(90deg, #c084fc, #a855f7, #7c3aed); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .feito-por { color: #facc15; font-weight: 700; margin-top: 8px; font-size: 16px; text-transform: uppercase; letter-spacing: 1px; }
  .main-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .key-box { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 30px 20px; max-width: 450px; width: 100%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .key-box h2 { font-size: 1.5rem; margin-bottom: 8px; color: var(--text); }
  .key-box p { font-size: 14px; color: var(--muted); margin-bottom: 24px; line-height: 1.5; }
  .key-display { width: 100%; padding: 16px; background: #0d0d14; border: 1px solid var(--border); border-radius: 12px; color: var(--accent); font-size: 20px; font-weight: 700; text-align: center; letter-spacing: 2px; margin-bottom: 16px; outline: none; }
  .key-display::placeholder { color: var(--border); letter-spacing: normal; font-weight: normal; font-size: 15px;}
  .btn-generate { width: 100%; padding: 16px; border-radius: 12px; border: none; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.2s; }
  .btn-generate:hover { filter: brightness(1.15); transform: scale(1.02); }
  .btn-generate:active { transform: scale(0.98); }
  .btn-generate:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
  .btn-copy { width: 100%; padding: 14px; margin-top: 10px; border-radius: 12px; border: 1px solid var(--border); background: transparent; color: var(--text); font-size: 15px; font-weight: 600; cursor: pointer; display: none; }
  .btn-copy:hover { background: rgba(255,255,255,0.05); }
  footer { text-align: center; padding: 20px; color: var(--muted); font-size: 13px; }
  .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--accent); color: #fff; padding: 12px 24px; border-radius: 12px; font-weight: 600; transition: .3s; z-index: 200; }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <h1>.. scripts.</h1>
  <p class="feito-por">Feito por: ..</p>
</header>

<div class="main-container">
  <div class="key-box">
    <h2>🔑 Gerador de Key</h2>
    <p>Clique no botão abaixo para gerar sua key de acesso. Ela é válida por <b>24 horas</b>.</p>
    
    <input type="text" id="keyDisplay" class="key-display" readonly placeholder="Sua key aparecerá aqui">
    
    <button id="generateBtn" class="btn-generate">Gerar Key</button>
    <button id="copyBtn" class="btn-copy">📋 Copiar Key</button>
  </div>
</div>

<footer>.. scripts. &copy; <span id="year"></span></footer>

<div class="toast" id="toast">Key Copiada! ✅</div>

<script>
// ==========================================
// SUA URL DO FIREBASE JÁ ESTÁ AQUI:
// ==========================================
const FIREBASE_URL = "https://scripts-none-default-rtdb.firebaseio.com"; 

document.getElementById('year').textContent = new Date().getFullYear();

const generateBtn = document.getElementById('generateBtn');
const keyDisplay = document.getElementById('keyDisplay');
const copyBtn = document.getElementById('copyBtn');
const toast = document.getElementById('toast');

generateBtn.onclick = async function() {
    generateBtn.innerText = "Gerando...";
    generateBtn.disabled = true;
    copyBtn.style.display = "none";
    
    const randomStr = Math.random().toString(36).substring(2, 6).toUpperCase() + "-" + Math.random().toString(36).substring(2, 6).toUpperCase();
    const key = `NONE-${randomStr}`;
    const expiresAt = Math.floor(Date.now() / 1000) + (24 * 60 * 60);
    
    try {
        const response = await fetch(`${FIREBASE_URL}/keys/${key}.json`, {
            method: 'PUT',
            body: JSON.stringify({ expiresAt: expiresAt, usedBy: null })
        });
        
        if (response.ok) {
            keyDisplay.value = key;
            generateBtn.innerText = "Gerar Outra Key";
            copyBtn.style.display = "block";
        } else {
            alert("Erro no servidor. Verifique as regras do Firebase.");
            generateBtn.innerText = "Gerar Key";
        }
    } catch (error) {
        alert("Erro de conexão. Tente novamente.");
        generateBtn.innerText = "Gerar Key";
    }
    
    generateBtn.disabled = false;
};

copyBtn.onclick = function() {
    if (keyDisplay.value) {
        navigator.clipboard.writeText(keyDisplay.value).then(() => {
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        });
    }
};
</script>
</body>
</html>
